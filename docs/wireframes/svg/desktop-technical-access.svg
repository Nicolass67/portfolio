<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe acces contenu technique</title>
  <desc id="desc">Proposition de conception non validee - sommaire et chapitres fermes</desc>
